[project]
name = "roadmap-rag-assistant"
version = "0.1.0"
description = "Mini RAG Assistant for Roadmap CUD via natural language"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.0",
    "langchain-core>=1.6.0",
    "langgraph>=1.2.0",
    "langchain-google-genai>=4.4.0",
    "fastapi>=0.140.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.0",
    "uuid-utils>=0.17.0",
    "aiosqlite>=0.21.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.0", "pytest-asyncio>=0.25.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
