<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VNFai Token Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 280px;
      padding: 16px;
      background: #fff;
      color: #111;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #d1d5db;
      flex-shrink: 0;
    }
    .dot.ok { background: #22c55e; }
    .dot.expired { background: #f97316; }
    .dot.none { background: #d1d5db; }
    h1 { font-size: 14px; font-weight: 600; }
    .status-box {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .status-box .label { color: #6b7280; }
    .status-box .value { color: #111; font-weight: 500; }
    .status-box .value.green { color: #16a34a; }
    .status-box .value.orange { color: #ea580c; }
    .status-box .value.gray { color: #9ca3af; font-style: italic; }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      background: #fff;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 6px;
    }
    .btn:hover { background: #f3f4f6; }
    .btn.primary {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    .btn.primary:hover { background: #374151; }
    .btn.danger { color: #dc2626; border-color: #fecaca; }
    .btn.danger:hover { background: #fef2f2; }
    .hint {
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot" id="statusDot"></div>
    <h1>VNFai Token Sync</h1>
  </div>

  <div class="status-box" id="statusBox">
    <div><span class="label">Trạng thái: </span><span class="value gray" id="statusText">Đang kiểm tra...</span></div>
    <div><span class="label">Hết hạn: </span><span class="value" id="expText">—</span></div>
    <div><span class="label">Lưu lúc: </span><span class="value" id="savedAtText">—</span></div>
  </div>

  <button class="btn primary" id="openVnfai">Mở upb.ops.vnfai.com</button>
  <button class="btn" id="copyToken">Copy token</button>
  <button class="btn danger" id="clearToken">Xóa token</button>
  <p class="hint" id="hint">Truy cập vnfai.com để tự động sync token</p>

  <script src="popup.js"></script>
</body>
</html>
