<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Knowledge OS Clipper</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --border: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: var(--bg); color: var(--text); padding: 16px; font-size: 13px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .title-group { display: flex; align-items: center; gap: 8px; }
    .badge { background: rgba(16, 185, 129, 0.15); color: #34d399; font-size: 10px; font-weight: 600; padding: 2px 6px; borderRadius: 12px; border: 1px solid rgba(16, 185, 129, 0.3); }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
    input, textarea { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px 10px; font-size: 12px; outline: none; }
    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 50px; }
    .row { display: flex; gap: 8px; }
    .row .form-group { flex: 1; }
    button { width: 100%; background: var(--primary); color: white; border: none; border-radius: 6px; padding: 9px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 11px; text-align: center; color: var(--muted); }
    .status.success { color: var(--success); }
    .status.error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <strong>Knowledge OS</strong>
      <span class="badge">Agent Ready</span>
    </div>
  </div>

  <form id="clipForm">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" required placeholder="Article title..." />
    </div>

    <div class="form-group">
      <label for="url">URL</label>
      <input type="url" id="url" required placeholder="https://..." />
    </div>

    <div class="form-group">
      <label for="summary">Summary / Key Takeaways</label>
      <textarea id="summary" placeholder="Summary or notes..."></textarea>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="category">Category</label>
        <input type="text" id="category" value="Web Clipper" />
      </div>
      <div class="form-group">
        <label for="tags">Tags (comma separated)</label>
        <input type="text" id="tags" value="web-clip, article" />
      </div>
    </div>

    <div class="form-group">
      <label for="endpoint">API Endpoint</label>
      <input type="text" id="endpoint" value="https://crisne.blog/api/v1/clipper" />
    </div>

    <div class="form-group">
      <label for="adminKey">Admin API Key (Optional)</label>
      <input type="password" id="adminKey" placeholder="x-admin-key" />
    </div>

    <button type="submit" id="saveBtn">Save to Knowledge OS</button>
  </form>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
